<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Family Wall Calendar</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <!-- Google Identity Services (GIS) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f8fafc;
      background-color: #0b1120;
      user-select: none;
      -webkit-user-select: none;
    }

    @supports (height: 100dvh) {
      html, body {
        height: 100dvh;
      }
    }

    .clock-font {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    /* Scenic Wall-Calendar Background Layers */
    .bg-layer {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 1.2s ease-in-out;
      z-index: 0;
    }

    .bg-scrim {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(8, 12, 24, 0.72) 0%,
        rgba(10, 16, 30, 0.62) 50%,
        rgba(8, 12, 24, 0.78) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    .glass-board {
      background: rgba(15, 23, 42, 0.56);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .glass-modal {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    /* Hide scrollbars inside compact day cells while still permitting touch scroll if needed */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="relative flex flex-col">

  <!-- Scenic Background Photo Layers -->
  <div id="bgLayerA" class="bg-layer opacity-100"></div>
  <div id="bgLayerB" class="bg-layer opacity-0"></div>
  <div class="bg-scrim"></div>

  <!-- Toast Status Pill -->
  <div id="toastBanner" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden px-5 py-2.5 rounded-full glass-modal text-white font-bold text-sm sm:text-base shadow-2xl border border-amber-300/40">
    <span id="toastMessage">Calendar synced</span>
  </div>

  <!-- FULL-VIEWPORT WALL CALENDAR SHELL -->
  <div class="relative z-10 flex flex-col w-full h-full p-2.5 sm:p-4 gap-2 sm:gap-3">

    <!-- TOP BAR: Month Title & Nav (Left) + Digital Clock, Date & 3 Icon Controls (Right) -->
    <header class="shrink-0 flex items-center justify-between gap-3 px-2 sm:px-3">

      <!-- Left: Large Month/Year Title & Minimal Arrow Navigation -->
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <div class="flex items-center gap-1">
          <button id="prevMonthBtn" type="button" title="Previous Month" aria-label="Previous Month"
            class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 text-white flex items-center justify-center transition cursor-pointer">
            <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
          </button>
          <button id="nextMonthBtn" type="button" title="Next Month" aria-label="Next Month"
            class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 text-white flex items-center justify-center transition cursor-pointer">
            <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
          </button>
          <button id="todayBtn" type="button" title="Jump to Today" aria-label="Jump to Today"
            class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 text-amber-300 flex items-center justify-center transition cursor-pointer">
            <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
        <!-- Month / Week / Schedule View Toggle -->
        <div class="inline-flex items-center p-1 rounded-xl bg-slate-950/60 border border-white/15 shrink-0" role="group" aria-label="Calendar View">
          <button id="viewMonthBtn" type="button"
            class="px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-lg text-xs sm:text-sm lg:text-base font-extrabold bg-amber-400 text-slate-950 shadow transition cursor-pointer">
            Month
          </button>
          <button id="viewWeekBtn" type="button"
            class="px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-lg text-xs sm:text-sm lg:text-base font-extrabold text-slate-200 hover:text-white transition cursor-pointer">
            Week
          </button>
          <button id="viewScheduleBtn" type="button"
            class="px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-lg text-xs sm:text-sm lg:text-base font-extrabold text-slate-200 hover:text-white transition cursor-pointer">
            Schedule
          </button>
        </div>
      </div>

      <!-- Right: Digital Clock + Current Date + 3 Icon-Only Buttons (Refresh, Fullscreen, Settings) -->
      <div class="flex items-center gap-3 sm:gap-5 shrink-0">
        <!-- Digital Clock & Date -->
        <div class="flex items-center gap-3 sm:gap-4 text-right">
          <div class="hidden sm:block leading-tight">
            <div id="headerDayName" class="text-sm lg:text-base font-extrabold uppercase tracking-wider text-amber-300">
              Saturday
            </div>
            <div id="headerFullDate" class="text-base lg:text-xl font-bold text-slate-100">
              Nov 21, 2026
            </div>
          </div>

          <div class="flex items-baseline gap-1 px-3 py-1.5 sm:px-4 sm:py-2 rounded-2xl bg-slate-950/60 border border-white/15 shadow-lg">
            <span id="clockTime" class="clock-font text-3xl sm:text-4xl lg:text-5xl font-extrabold tracking-tight text-white leading-none">
              10:46
            </span>
            <span id="clockAmPm" class="text-xs sm:text-sm lg:text-base font-extrabold uppercase text-amber-300">
              PM
            </span>
          </div>
        </div>

        <!-- 3 Icon-Only Controls: Refresh, Fullscreen, Settings -->
        <div class="flex items-center gap-1.5 sm:gap-2">
          <button id="refreshBtn" type="button" title="Refresh Google Calendar" aria-label="Refresh Google Calendar"
            class="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-white/12 hover:bg-white/25 active:scale-95 text-white flex items-center justify-center border border-white/15 transition cursor-pointer">
            <svg id="refreshIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>
          </button>

          <button id="fullscreenBtn" type="button" title="Toggle Fullscreen" aria-label="Toggle Fullscreen"
            class="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-white/12 hover:bg-white/25 active:scale-95 text-white flex items-center justify-center border border-white/15 transition cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
            </svg>
          </button>

          <button id="settingsBtn" type="button" title="Calendar Settings" aria-label="Calendar Settings"
            class="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-white/12 hover:bg-white/25 active:scale-95 text-white flex items-center justify-center border border-white/15 transition cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN FULL-SCREEN MONTHLY CALENDAR BOARD -->
    <main class="flex-1 min-h-0 glass-board rounded-3xl p-2 sm:p-3.5 flex flex-col">
      <!-- MONTHLY VIEW CONTAINER -->
      <div id="monthViewContainer" class="flex-1 min-h-0 flex flex-col">
        <!-- Day-of-Week Header Row (Monday First) -->
        <div class="shrink-0 grid grid-cols-7 gap-1.5 sm:gap-2 pb-1.5 sm:pb-2 text-center font-extrabold text-xs sm:text-base lg:text-lg uppercase tracking-wider text-amber-300">
          <div>Mon</div>
          <div>Tue</div>
          <div>Wed</div>
          <div>Thu</div>
          <div>Fri</div>
          <div>Sat</div>
          <div>Sun</div>
        </div>

        <!-- Month Grid: Dynamically sized rows with minmax(0, 1fr) so bottom weeks NEVER clip -->
        <div id="monthGrid" class="flex-1 min-h-0 grid grid-cols-7 gap-1.5 sm:gap-2"></div>
      </div>

      <!-- WEEK VIEW CONTAINER (Monday - Sunday Large Wall Columns) -->
      <div id="weekViewContainer" class="hidden flex-1 min-h-0 flex flex-col">
        <div id="weekRangeHeader" class="shrink-0 flex items-center justify-between gap-2 px-2 pb-2 sm:pb-2.5 text-sm sm:text-base lg:text-xl font-extrabold text-amber-300">
          <span id="weekRangeLabel">Week View</span>
        </div>
        <div id="weekGrid" class="flex-1 min-h-0 grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-1.5 sm:gap-2 overflow-y-auto no-scrollbar"></div>
      </div>

      <!-- SCHEDULE / AGENDA VIEW CONTAINER -->
      <div id="scheduleViewContainer" class="hidden flex-1 min-h-0 flex flex-col">
        <div class="shrink-0 flex items-center justify-between gap-3 px-2 pb-2.5 sm:pb-3 border-b border-white/15">
          <div class="text-sm sm:text-lg lg:text-xl font-extrabold uppercase tracking-wider text-amber-300">
            Upcoming Family Schedule
          </div>
          <button id="scheduleAddBtn" type="button"
            class="px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 active:scale-95 text-slate-950 font-black text-xs sm:text-sm lg:text-base shadow cursor-pointer">
            + Add Event
          </button>
        </div>
        <div id="scheduleList" class="flex-1 min-h-0 overflow-y-auto no-scrollbar pt-3 space-y-3 sm:space-y-4"></div>
      </div>
    </main>
  </div>

  <!-- MODAL 1: DAY AGENDA & ADD/EDIT EVENT MODAL -->
  <div id="dayModal" class="fixed inset-0 z-40 hidden items-center justify-center p-3 sm:p-5 bg-slate-950/75 backdrop-blur-sm">
    <div class="glass-modal rounded-3xl w-full max-w-2xl max-h-[92dvh] flex flex-col overflow-hidden">
      <!-- Modal Header -->
      <div class="shrink-0 flex items-center justify-between px-5 py-4 border-b border-white/15">
        <div>
          <div class="text-xs font-extrabold uppercase tracking-wider text-amber-300">Family Schedule</div>
          <h2 id="dayModalTitle" class="text-xl sm:text-2xl font-black text-white">Saturday, November 21, 2026</h2>
        </div>
        <button id="closeDayModalBtn" type="button" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center cursor-pointer">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal Body: Existing Events List + Quick Add/Edit Form -->
      <div class="flex-1 overflow-y-auto p-5 space-y-5">
        <!-- Events on Selected Day -->
        <div id="dayModalEventsList" class="space-y-2"></div>

        <!-- Add / Edit Event Form -->
        <form id="eventForm" class="space-y-3.5 pt-3 border-t border-white/15">
          <div class="flex items-center justify-between">
            <h3 id="eventFormHeading" class="text-lg font-extrabold text-amber-300">+ Schedule Event</h3>
            <button id="resetFormBtn" type="button" class="hidden text-xs font-bold px-3 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-slate-200 cursor-pointer">
              + New Event Instead
            </button>
          </div>

          <input type="hidden" id="editEventId" />

          <div>
            <input id="eventTitleInput" type="text" required placeholder="Event title (e.g., Soccer Practice, Dinner)"
              class="w-full px-4 py-3 rounded-2xl bg-slate-950/80 border border-white/20 text-white text-base sm:text-lg font-semibold focus:outline-none focus:border-amber-400" />
          </div>

          <!-- Calendar Owner Selector -->
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="eventOwner" value="mine" class="peer hidden" checked />
              <div class="py-2.5 px-2 rounded-xl border border-white/20 bg-white/5 peer-checked:bg-sky-500/35 peer-checked:border-sky-400 text-center font-bold text-sm sm:text-base text-white transition">
                <span id="formMineLabel">Me</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="eventOwner" value="wife" class="peer hidden" />
              <div class="py-2.5 px-2 rounded-xl border border-white/20 bg-white/5 peer-checked:bg-rose-500/35 peer-checked:border-rose-400 text-center font-bold text-sm sm:text-base text-white transition">
                <span id="formWifeLabel">Wife</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="eventOwner" value="family" class="peer hidden" />
              <div class="py-2.5 px-2 rounded-xl border border-white/20 bg-white/5 peer-checked:bg-emerald-500/35 peer-checked:border-emerald-400 text-center font-bold text-sm sm:text-base text-white transition">
                <span>Family</span>
              </div>
            </label>
          </div>

          <!-- Date & All-Day Toggle -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input id="eventDateInput" type="date" required
              class="w-full px-4 py-2.5 rounded-xl bg-slate-950/80 border border-white/20 text-white text-base font-semibold focus:outline-none focus:border-amber-400" />

            <label class="flex items-center justify-between px-4 py-2.5 rounded-xl bg-slate-950/60 border border-white/15 cursor-pointer">
              <span class="text-sm sm:text-base font-bold text-slate-200">All-Day Event</span>
              <input id="eventAllDayInput" type="checkbox" class="w-5 h-5 accent-amber-400 rounded" />
            </label>
          </div>

          <!-- Start & End Time -->
          <div id="eventTimeRow" class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">Start Time</label>
              <input id="eventStartInput" type="time" value="09:00"
                class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950/80 border border-white/20 text-white text-base font-semibold focus:outline-none focus:border-amber-400" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1">End Time</label>
              <input id="eventEndInput" type="time" value="10:00"
                class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950/80 border border-white/20 text-white text-base font-semibold focus:outline-none focus:border-amber-400" />
            </div>
          </div>

          <div class="flex items-center justify-between gap-2 pt-2">
            <button id="deleteEventBtn" type="button"
              class="hidden px-4 py-3 rounded-xl bg-rose-600/80 hover:bg-rose-500 text-white font-bold text-sm sm:text-base cursor-pointer">
              Delete Event
            </button>
            <button type="submit"
              class="ml-auto px-6 py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-base shadow-lg cursor-pointer">
              Save Event
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL 2: SETTINGS & GOOGLE CALENDAR SYNC -->
  <div id="settingsModal" class="fixed inset-0 z-40 hidden items-center justify-center p-3 sm:p-5 bg-slate-950/80 backdrop-blur-sm">
    <div class="glass-modal rounded-3xl w-full max-w-2xl max-h-[92dvh] flex flex-col overflow-hidden">
      <div class="shrink-0 flex items-center justify-between px-5 py-4 border-b border-white/15">
        <h2 class="text-xl sm:text-2xl font-black text-white">Wall Calendar Settings</h2>
        <button id="closeSettingsBtn" type="button" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center cursor-pointer">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-5 space-y-5">
        <!-- Google OAuth Connection -->
        <div class="p-4 rounded-2xl bg-slate-950/65 border border-white/15 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-base sm:text-lg font-extrabold text-sky-300">Google Calendar Two-Way Sync</h3>
            <span id="googleStatusBadge" class="px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-300">
              Not Connected
            </span>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Google OAuth 2.0 Client ID (Web Application)</label>
            <input id="clientIdInput" type="text" placeholder="1234567890-abcdef.apps.googleusercontent.com"
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-white/20 text-white text-sm font-mono focus:outline-none focus:border-sky-400" />
          </div>

          <div class="flex flex-wrap items-center gap-2.5">
            <button id="connectGoogleBtn" type="button"
              class="px-5 py-2.5 rounded-xl bg-sky-400 hover:bg-sky-300 text-slate-950 font-extrabold text-sm sm:text-base cursor-pointer">
              Connect Google Account
            </button>
            <button id="disconnectGoogleBtn" type="button"
              class="hidden px-4 py-2.5 rounded-xl bg-rose-500/25 hover:bg-rose-500/40 border border-rose-400/40 text-rose-200 font-bold text-sm cursor-pointer">
              Disconnect
            </button>
          </div>

          <!-- Calendar Mapping Selectors (Visible after sign-in) -->
          <div id="calendarMappingSection" class="hidden pt-3 border-t border-white/15 space-y-3">
            <p class="text-xs font-bold text-emerald-300">Select which Google Calendars to display &amp; sync:</p>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-sky-300 mb-1">My Calendar (Blue)</label>
                <select id="mapMineSelect" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-white/20 text-white text-sm"></select>
              </div>
              <div>
                <label class="block text-xs font-bold text-rose-300 mb-1">Wife's Calendar (Coral)</label>
                <select id="mapWifeSelect" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-white/20 text-white text-sm"></select>
              </div>
              <div>
                <label class="block text-xs font-bold text-emerald-300 mb-1">Family Calendar (Green)</label>
                <select id="mapFamilySelect" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-white/20 text-white text-sm"></select>
              </div>
            </div>
          </div>
        </div>

        <!-- Names, Clock & Background Preferences -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Your Label</label>
            <input id="mineNameInput" type="text" value="Me"
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950/80 border border-white/20 text-white text-sm font-semibold" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Wife's Label</label>
            <input id="wifeNameInput" type="text" value="Wife"
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950/80 border border-white/20 text-white text-sm font-semibold" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Clock Format</label>
            <select id="clockFormatSelect" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950/80 border border-white/20 text-white text-sm font-semibold">
              <option value="12">12-Hour (AM / PM)</option>
              <option value="24">24-Hour</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Wall Background Photo</label>
            <select id="wallpaperSelect" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950/80 border border-white/20 text-white text-sm font-semibold">
              <option value="rotate">Auto-Rotate Scenic Photos</option>
              <option value="0">Yosemite Valley Sunrise</option>
              <option value="1">Misty Forest Ridge</option>
              <option value="2">Alpine Peaks</option>
              <option value="3">Crystal Mountain Lake</option>
              <option value="4">Coastal Horizon</option>
            </select>
          </div>
        </div>
      </div>

      <div class="shrink-0 flex justify-end px-5 py-4 border-t border-white/15">
        <button id="saveSettingsBtn" type="button"
          class="px-6 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-base shadow-lg cursor-pointer">
          Save &amp; Close
        </button>
      </div>
    </div>
  </div>

  <!-- APPLICATION SCRIPT -->
  <script>
    (function () {
      'use strict';

      /* =====================================================================
         1. SCENIC WALL-CALENDAR BACKGROUNDS
         ===================================================================== */
      const WALLPAPERS = [
        'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1920&q=80',
        'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80'
      ];

      /* =====================================================================
         2. PERSISTENT STATE
         ===================================================================== */
      const STORAGE_SETTINGS = 'fwc_settings_v2';
      const STORAGE_EVENTS = 'fwc_events_v2';
      const STORAGE_GOOGLE_SESSION = 'fwc_google_session_v1';

      const defaultSettings = {
        mineName: 'Me',
        wifeName: 'Wife',
        clockFormat: '12',
        wallpaperMode: 'rotate',
        googleClientId: '',
        mapMineCalendarId: 'primary',
        mapWifeCalendarId: '',
        mapFamilyCalendarId: ''
      };

      function loadJSON(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (err) {
          return fallback;
        }
      }

      function saveJSON(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (err) {
          console.warn('localStorage write skipped:', err);
        }
      }

      function removeStorageKey(key) {
        try {
          localStorage.removeItem(key);
        } catch (err) {
          console.warn('localStorage remove skipped:', err);
        }
      }

      let settings = { ...defaultSettings, ...loadJSON(STORAGE_SETTINGS, {}) };
      let currentView = 'month'; // 'month' | 'week' | 'schedule'
      let viewedMonthDate = new Date();
      let viewedWeekAnchorDate = new Date();
      let selectedDayISO = toISODate(new Date());
      let wallpaperIdx = 0;
      let activeBgLayer = 'A';
      let wallpaperTimer = null;

      let googleAccessToken = null;
      let googleTokenExpiresAt = 0;
      let tokenClient = null;
      let googleCalendars = [];
      let autoSyncTimer = null;

      let events = loadJSON(STORAGE_EVENTS, getSampleEvents());

      function saveGoogleSession(token, expiresInSeconds, calendarsList) {
        const expiresAt = Date.now() + (Number(expiresInSeconds) || 3500) * 1000;
        googleAccessToken = token;
        googleTokenExpiresAt = expiresAt;
        if (Array.isArray(calendarsList)) {
          googleCalendars = calendarsList;
        }
        saveJSON(STORAGE_GOOGLE_SESSION, {
          accessToken: token,
          expiresAt,
          calendars: googleCalendars
        });
      }

      function restoreGoogleSession() {
        const savedSession = loadJSON(STORAGE_GOOGLE_SESSION, null);
        if (!savedSession || !savedSession.accessToken) return false;

        if (Array.isArray(savedSession.calendars)) {
          googleCalendars = savedSession.calendars;
        }

        // Keep a 60-second safety margin before token expiration
        if (savedSession.expiresAt && Date.now() < savedSession.expiresAt - 60000) {
          googleAccessToken = savedSession.accessToken;
          googleTokenExpiresAt = savedSession.expiresAt;
          return true;
        }

        // Token expired; clear stale token while keeping cached calendar list
        removeStorageKey(STORAGE_GOOGLE_SESSION);
        googleAccessToken = null;
        googleTokenExpiresAt = 0;
        return false;
      }

      /* =====================================================================
         3. DATE, TIME & THEME HELPERS
         ===================================================================== */
      function toISODate(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function getSampleEvents() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const todayStr = toISODate(now);
        return [
          {
            id: 'sample-1',
            title: 'Family Dinner',
            owner: 'family',
            date: todayStr,
            allDay: false,
            startTime: '18:30',
            endTime: '20:00'
          },
          {
            id: 'sample-2',
            title: 'Dentist Checkup',
            owner: 'mine',
            date: `${y}-${m}-12`,
            allDay: false,
            startTime: '10:00',
            endTime: '11:00'
          },
          {
            id: 'sample-3',
            title: 'Yoga Class',
            owner: 'wife',
            date: `${y}-${m}-18`,
            allDay: false,
            startTime: '17:30',
            endTime: '18:30'
          }
        ];
      }

      function formatTime12or24(time24) {
        if (!time24) return '';
        const [hStr, mStr] = time24.split(':');
        let h = parseInt(hStr, 10);
        if (isNaN(h)) return time24;
        if (settings.clockFormat === '24') {
          return `${String(h).padStart(2, '0')}:${mStr}`;
        }
        const suffix = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        return `${h}:${mStr} ${suffix}`;
      }

      function getOwnerTheme(owner) {
        if (owner === 'wife') {
          return {
            label: settings.wifeName || 'Wife',
            pillClass: 'bg-rose-500/35 border-rose-300/60 text-rose-50'
          };
        }
        if (owner === 'family') {
          return {
            label: 'Family',
            pillClass: 'bg-emerald-500/35 border-emerald-300/60 text-emerald-50'
          };
        }
        return {
          label: settings.mineName || 'Me',
          pillClass: 'bg-sky-500/35 border-sky-300/60 text-sky-50'
        };
      }

      let toastTimeout = null;
      function showToast(msg) {
        const banner = document.getElementById('toastBanner');
        const textEl = document.getElementById('toastMessage');
        if (!banner || !textEl) return;
        textEl.textContent = msg;
        banner.classList.remove('hidden');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          banner.classList.add('hidden');
        }, 3200);
      }

      /* =====================================================================
         4. DIGITAL CLOCK & HEADER DATE
         ===================================================================== */
      function updateClock() {
        const now = new Date();
        const timeEl = document.getElementById('clockTime');
        const ampmEl = document.getElementById('clockAmPm');
        const dayEl = document.getElementById('headerDayName');
        const dateEl = document.getElementById('headerFullDate');

        let hours = now.getHours();
        const mins = String(now.getMinutes()).padStart(2, '0');

        if (settings.clockFormat === '24') {
          if (timeEl) timeEl.textContent = `${String(hours).padStart(2, '0')}:${mins}`;
          if (ampmEl) ampmEl.textContent = '';
        } else {
          const ampm = hours >= 12 ? 'PM' : 'AM';
          hours = hours % 12 || 12;
          if (timeEl) timeEl.textContent = `${hours}:${mins}`;
          if (ampmEl) ampmEl.textContent = ampm;
        }

        if (dayEl) {
          dayEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long' });
        }
        if (dateEl) {
          dateEl.textContent = now.toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric'
          });
        }
      }

      /* =====================================================================
         5. WALL-CALENDAR BACKGROUND CROSSFADE
         ===================================================================== */
      function setBackgroundImage(url) {
        const layerA = document.getElementById('bgLayerA');
        const layerB = document.getElementById('bgLayerB');
        if (!layerA || !layerB) return;

        if (activeBgLayer === 'A') {
          layerB.style.backgroundImage = `url("${url}")`;
          layerB.classList.replace('opacity-0', 'opacity-100');
          layerA.classList.replace('opacity-100', 'opacity-0');
          activeBgLayer = 'B';
        } else {
          layerA.style.backgroundImage = `url("${url}")`;
          layerA.classList.replace('opacity-0', 'opacity-100');
          layerB.classList.replace('opacity-100', 'opacity-0');
          activeBgLayer = 'A';
        }
      }

      function applyWallpaperPreference() {
        clearInterval(wallpaperTimer);
        wallpaperTimer = null;

        if (settings.wallpaperMode === 'rotate') {
          setBackgroundImage(WALLPAPERS[wallpaperIdx % WALLPAPERS.length]);
          wallpaperTimer = setInterval(() => {
            wallpaperIdx = (wallpaperIdx + 1) % WALLPAPERS.length;
            setBackgroundImage(WALLPAPERS[wallpaperIdx]);
          }, 5 * 60 * 1000);
        } else {
          const parsedIdx = parseInt(settings.wallpaperMode, 10);
          const safeIdx = isNaN(parsedIdx)
            ? 0
            : ((parsedIdx % WALLPAPERS.length) + WALLPAPERS.length) % WALLPAPERS.length;
          wallpaperIdx = safeIdx;
          setBackgroundImage(WALLPAPERS[safeIdx]);
        }
      }

      /* =====================================================================
         6. FULL-SCREEN MONTHLY CALENDAR RENDERER (MONDAY FIRST)
         ===================================================================== */
      function renderMonthCalendar() {
        const year = viewedMonthDate.getFullYear();
        const month = viewedMonthDate.getMonth();
        const grid = document.getElementById('monthGrid');
        if (!grid) return;
        grid.innerHTML = '';

        const firstDayOfMonth = new Date(year, month, 1);
        const lastDayOfMonth = new Date(year, month + 1, 0);
        const daysInMonth = lastDayOfMonth.getDate();

        // Monday = 0, Tuesday = 1, ..., Sunday = 6
        const leadingBlanks = (firstDayOfMonth.getDay() + 6) % 7;
        const totalCells = leadingBlanks + daysInMonth;
        const numRows = totalCells > 35 ? 6 : 5;
        const cellCount = numRows * 7;

        grid.style.gridTemplateRows = `repeat(${numRows}, minmax(0, 1fr))`;

        const prevMonthLastDay = new Date(year, month, 0).getDate();
        const todayISO = toISODate(new Date());

        for (let i = 0; i < cellCount; i++) {
          let cellYear = year;
          let cellMonth = month;
          let dayNum;
          let isCurrentMonth = true;

          if (i < leadingBlanks) {
            dayNum = prevMonthLastDay - leadingBlanks + i + 1;
            cellMonth = month - 1;
            if (cellMonth < 0) {
              cellMonth = 11;
              cellYear = year - 1;
            }
            isCurrentMonth = false;
          } else if (i >= leadingBlanks + daysInMonth) {
            dayNum = i - (leadingBlanks + daysInMonth) + 1;
            cellMonth = month + 1;
            if (cellMonth > 11) {
              cellMonth = 0;
              cellYear = year + 1;
            }
            isCurrentMonth = false;
          } else {
            dayNum = i - leadingBlanks + 1;
          }

          const isoDate = toISODate(new Date(cellYear, cellMonth, dayNum));
          const isToday = isoDate === todayISO;

          const cell = document.createElement('div');
          cell.className = `rounded-2xl p-1.5 sm:p-2 flex flex-col min-h-0 overflow-hidden border transition cursor-pointer ${
            isToday
              ? 'bg-amber-400/20 border-amber-300 shadow-lg'
              : isCurrentMonth
                ? 'bg-slate-950/45 hover:bg-slate-900/65 border-white/12'
                : 'bg-slate-950/20 hover:bg-slate-900/35 border-white/5 opacity-45'
          }`;
          cell.addEventListener('click', () => openDayModal(isoDate));

          const topRow = document.createElement('div');
          topRow.className = 'shrink-0 flex items-center justify-between gap-1 mb-0.5 sm:mb-1';

          const dayBadge = document.createElement('span');
          dayBadge.className = isToday
            ? 'w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-amber-400 text-slate-950 font-black text-xs sm:text-base lg:text-lg flex items-center justify-center'
            : 'text-sm sm:text-lg lg:text-2xl font-extrabold text-white leading-none px-1';
          dayBadge.textContent = String(dayNum);
          topRow.appendChild(dayBadge);

          cell.appendChild(topRow);

          const dayEvents = events
            .filter(ev => ev.date === isoDate)
            .sort((a, b) => {
              if (a.allDay && !b.allDay) return -1;
              if (!a.allDay && b.allDay) return 1;
              return (a.startTime || '').localeCompare(b.startTime || '');
            });

          const eventsWrap = document.createElement('div');
          eventsWrap.className = 'flex-1 min-h-0 overflow-y-auto no-scrollbar space-y-1';

          dayEvents.forEach(ev => {
            const theme = getOwnerTheme(ev.owner);
            const pill = document.createElement('div');
            pill.className = `px-1.5 py-0.5 sm:px-2 sm:py-1 rounded-lg border text-xs sm:text-sm lg:text-base font-bold truncate ${theme.pillClass}`;
            const timePrefix = ev.allDay ? '' : `${formatTime12or24(ev.startTime)} `;
            pill.textContent = `${timePrefix}${ev.title}`;
            pill.title = `${timePrefix}${ev.title} (${theme.label})`;
            pill.addEventListener('click', (e) => {
              e.stopPropagation();
              openDayModal(isoDate, ev);
            });
            eventsWrap.appendChild(pill);
          });

          cell.appendChild(eventsWrap);
          grid.appendChild(cell);
        }
      }

      function getMondayOfWeek(dateObj) {
        const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
        const offsetToMonday = (d.getDay() + 6) % 7; // Monday = 0 .. Sunday = 6
        d.setDate(d.getDate() - offsetToMonday);
        return d;
      }

      function renderWeekView() {
        const grid = document.getElementById('weekGrid');
        const rangeLabel = document.getElementById('weekRangeLabel');
        if (!grid) return;
        grid.innerHTML = '';

        const monday = getMondayOfWeek(viewedWeekAnchorDate);
        const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
        const todayISO = toISODate(new Date());

        if (rangeLabel) {
          const startStr = monday.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          const endStr = sunday.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          rangeLabel.textContent = `${startStr} – ${endStr}`;
        }

        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
          const isoDate = toISODate(dayDate);
          const isToday = isoDate === todayISO;

          const col = document.createElement('div');
          col.className = `rounded-2xl p-2 sm:p-2.5 flex flex-col min-h-[160px] lg:min-h-0 overflow-hidden border transition cursor-pointer ${
            isToday
              ? 'bg-amber-400/20 border-amber-300 shadow-lg'
              : 'bg-slate-950/50 hover:bg-slate-900/65 border-white/15'
          }`;
          col.addEventListener('click', () => openDayModal(isoDate));

          const header = document.createElement('div');
          header.className = 'shrink-0 flex items-center justify-between gap-1 pb-1.5 mb-1.5 border-b border-white/12';

          const weekdaySpan = document.createElement('span');
          weekdaySpan.className = `text-xs sm:text-sm font-extrabold uppercase tracking-wider ${
            isToday ? 'text-amber-300' : 'text-slate-300'
          }`;
          weekdaySpan.textContent = dayDate.toLocaleDateString('en-US', { weekday: 'short' });

          const dayNumBadge = document.createElement('span');
          dayNumBadge.className = isToday
            ? 'w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-amber-400 text-slate-950 font-black text-sm sm:text-base flex items-center justify-center'
            : 'text-base sm:text-xl font-black text-white px-1';
          dayNumBadge.textContent = String(dayDate.getDate());

          header.appendChild(weekdaySpan);
          header.appendChild(dayNumBadge);
          col.appendChild(header);

          const dayEvents = events
            .filter(ev => ev.date === isoDate)
            .sort((a, b) => {
              if (a.allDay && !b.allDay) return -1;
              if (!a.allDay && b.allDay) return 1;
              return (a.startTime || '').localeCompare(b.startTime || '');
            });

          const listWrap = document.createElement('div');
          listWrap.className = 'flex-1 min-h-0 overflow-y-auto no-scrollbar space-y-1.5';

          if (dayEvents.length === 0) {
            const emptyHint = document.createElement('div');
            emptyHint.className = 'text-xs text-slate-400/70 italic pt-1';
            emptyHint.textContent = 'No events';
            listWrap.appendChild(emptyHint);
          } else {
            dayEvents.forEach(ev => {
              const theme = getOwnerTheme(ev.owner);
              const card = document.createElement('div');
              card.className = `px-2 py-1.5 rounded-xl border text-xs sm:text-sm font-bold leading-snug ${theme.pillClass}`;
              card.addEventListener('click', (e) => {
                e.stopPropagation();
                openDayModal(isoDate, ev);
              });

              const timeLabel = document.createElement('div');
              timeLabel.className = 'clock-font text-[11px] sm:text-xs font-extrabold opacity-90';
              timeLabel.textContent = ev.allDay ? 'All Day' : formatTime12or24(ev.startTime);

              const titleLabel = document.createElement('div');
              titleLabel.className = 'text-xs sm:text-sm lg:text-base font-black break-words';
              titleLabel.textContent = ev.title;

              card.appendChild(timeLabel);
              card.appendChild(titleLabel);
              listWrap.appendChild(card);
            });
          }

          col.appendChild(listWrap);
          grid.appendChild(col);
        }
      }

      /* =====================================================================
         6B. LARGE-FONT CHRONOLOGICAL SCHEDULE / AGENDA RENDERER
         ===================================================================== */
      function setCalendarView(viewMode) {
        if (viewMode === 'week') {
          currentView = 'week';
        } else if (viewMode === 'schedule') {
          currentView = 'schedule';
        } else {
          currentView = 'month';
        }

        const monthContainer = document.getElementById('monthViewContainer');
        const weekContainer = document.getElementById('weekViewContainer');
        const scheduleContainer = document.getElementById('scheduleViewContainer');

        const monthBtn = document.getElementById('viewMonthBtn');
        const weekBtn = document.getElementById('viewWeekBtn');
        const scheduleBtn = document.getElementById('viewScheduleBtn');

        const activeClasses = ['bg-amber-400', 'text-slate-950', 'shadow'];
        const inactiveClasses = ['text-slate-200', 'hover:text-white'];

        if (monthContainer) monthContainer.classList.toggle('hidden', currentView !== 'month');
        if (weekContainer) weekContainer.classList.toggle('hidden', currentView !== 'week');
        if (scheduleContainer) scheduleContainer.classList.toggle('hidden', currentView !== 'schedule');

        [
          [monthBtn, currentView === 'month'],
          [weekBtn, currentView === 'week'],
          [scheduleBtn, currentView === 'schedule']
        ].forEach(([btn, isActive]) => {
          if (!btn) return;
          if (isActive) {
            btn.classList.add(...activeClasses);
            btn.classList.remove(...inactiveClasses);
          } else {
            btn.classList.remove(...activeClasses);
            btn.classList.add(...inactiveClasses);
          }
        });

        renderActiveView();
      }

      function renderActiveView() {
        if (currentView === 'week') {
          renderWeekView();
        } else if (currentView === 'schedule') {
          renderScheduleView();
        } else {
          renderMonthCalendar();
        }
      }

      function renderScheduleView() {
        const year = viewedMonthDate.getFullYear();
        const month = viewedMonthDate.getMonth();
        const listEl = document.getElementById('scheduleList');
        if (!listEl) return;
        listEl.innerHTML = '';

        const todayISO = toISODate(new Date());
        const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}-`;
        const isCurrentMonth =
          year === new Date().getFullYear() && month === new Date().getMonth();

        // Filter events for the viewed month (from today onward if viewing current month)
        const filtered = events
          .filter(ev => {
            if (!ev.date || !ev.date.startsWith(monthPrefix)) return false;
            if (isCurrentMonth && ev.date < todayISO) return false;
            return true;
          })
          .sort((a, b) => {
            if (a.date !== b.date) return a.date.localeCompare(b.date);
            if (a.allDay && !b.allDay) return -1;
            if (!a.allDay && b.allDay) return 1;
            return (a.startTime || '').localeCompare(b.startTime || '');
          });

        if (filtered.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'flex flex-col items-center justify-center py-14 px-4 text-center rounded-2xl bg-slate-950/45 border border-white/10';
          empty.innerHTML = `
            <p class="text-xl sm:text-2xl font-extrabold text-slate-200 mb-2">No upcoming events in ${viewedMonthDate.toLocaleDateString('en-US', { month: 'long' })}</p>
            <p class="text-sm sm:text-base text-slate-400">Tap "+ Add Event" above or switch back to Month view to schedule.</p>
          `;
          listEl.appendChild(empty);
          return;
        }

        // Group events chronologically by date
        const grouped = new Map();
        filtered.forEach(ev => {
          if (!grouped.has(ev.date)) grouped.set(ev.date, []);
          grouped.get(ev.date).push(ev);
        });

        grouped.forEach((dayEvents, isoDate) => {
          const [y, m, d] = isoDate.split('-').map(Number);
          const dateObj = new Date(y, m - 1, d);
          const isToday = isoDate === todayISO;

          const dayCard = document.createElement('section');
          dayCard.className = `rounded-2xl p-3.5 sm:p-5 border transition ${
            isToday
              ? 'bg-amber-400/20 border-amber-300 shadow-lg'
              : 'bg-slate-950/55 border-white/15'
          }`;

          // Day Header Row
          const dayHeader = document.createElement('div');
          dayHeader.className = 'flex items-center justify-between gap-3 pb-2.5 mb-3 border-b border-white/15';

          const dateHeading = document.createElement('div');
          dateHeading.className = 'flex items-center gap-2.5 flex-wrap';
          dateHeading.innerHTML = `
            <span class="text-xl sm:text-2xl lg:text-3xl font-black ${isToday ? 'text-amber-300' : 'text-white'}">
              ${dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}
            </span>
            ${isToday ? '<span class="px-2.5 py-0.5 rounded-full text-xs sm:text-sm font-black uppercase bg-amber-400 text-slate-950">Today</span>' : ''}
          `;

          const addDayBtn = document.createElement('button');
          addDayBtn.type = 'button';
          addDayBtn.className = 'px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs sm:text-sm font-extrabold text-amber-200 cursor-pointer shrink-0';
          addDayBtn.textContent = '+ Add';
          addDayBtn.addEventListener('click', () => openDayModal(isoDate));

          dayHeader.appendChild(dateHeading);
          dayHeader.appendChild(addDayBtn);
          dayCard.appendChild(dayHeader);

          // Day Event Rows
          const eventsStack = document.createElement('div');
          eventsStack.className = 'space-y-2.5';

          dayEvents.forEach(ev => {
            const theme = getOwnerTheme(ev.owner);
            const timeText = ev.allDay
              ? 'All Day'
              : `${formatTime12or24(ev.startTime)}${ev.endTime ? ' – ' + formatTime12or24(ev.endTime) : ''}`;

            const itemRow = document.createElement('div');
            itemRow.className = `flex items-center justify-between gap-3 sm:gap-4 px-4 py-3 sm:py-3.5 rounded-2xl border cursor-pointer hover:brightness-110 active:scale-[0.99] transition ${theme.pillClass}`;
            itemRow.addEventListener('click', () => openDayModal(isoDate, ev));

            const leftInfo = document.createElement('div');
            leftInfo.className = 'flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4 min-w-0';

            const timeSpan = document.createElement('span');
            timeSpan.className = 'clock-font text-sm sm:text-lg lg:text-xl font-extrabold opacity-95 shrink-0';
            timeSpan.textContent = timeText;

            const titleSpan = document.createElement('span');
            titleSpan.className = 'text-lg sm:text-xl lg:text-2xl font-black truncate';
            titleSpan.textContent = ev.title;

            leftInfo.appendChild(timeSpan);
            leftInfo.appendChild(titleSpan);

            const ownerBadge = document.createElement('span');
            ownerBadge.className = 'shrink-0 px-3 py-1 rounded-full bg-slate-950/45 border border-white/20 text-xs sm:text-sm font-extrabold';
            ownerBadge.textContent = theme.label;

            itemRow.appendChild(leftInfo);
            itemRow.appendChild(ownerBadge);
            eventsStack.appendChild(itemRow);
          });

          dayCard.appendChild(eventsStack);
          listEl.appendChild(dayCard);
        });
      }

      /* =====================================================================
         7. DAY AGENDA MODAL & TWO-WAY EVENT CRUD
         ===================================================================== */
      function openDayModal(isoDate, eventToEdit = null) {
        selectedDayISO = isoDate;
        const [y, m, d] = isoDate.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);

        const titleEl = document.getElementById('dayModalTitle');
        if (titleEl) {
          titleEl.textContent = dateObj.toLocaleDateString('en-US', {
            weekday: 'long',
            month: 'long',
            day: 'numeric',
            year: 'numeric'
          });
        }

        const mineLbl = document.getElementById('formMineLabel');
        const wifeLbl = document.getElementById('formWifeLabel');
        if (mineLbl) mineLbl.textContent = settings.mineName || 'Me';
        if (wifeLbl) wifeLbl.textContent = settings.wifeName || 'Wife';

        renderDayEventsList(isoDate);

        if (eventToEdit) {
          populateEventFormForEdit(eventToEdit);
        } else {
          resetEventForm(isoDate);
        }

        const modal = document.getElementById('dayModal');
        if (modal) {
          modal.classList.remove('hidden');
          modal.classList.add('flex');
        }
      }

      function closeDayModal() {
        const modal = document.getElementById('dayModal');
        if (modal) {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        }
      }

      function renderDayEventsList(isoDate) {
        const listEl = document.getElementById('dayModalEventsList');
        if (!listEl) return;
        listEl.innerHTML = '';

        const dayEvents = events
          .filter(ev => ev.date === isoDate)
          .sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));

        if (dayEvents.length === 0) {
          listEl.innerHTML = `<div class="text-sm text-slate-400 italic">No events scheduled for this day yet.</div>`;
          return;
        }

        dayEvents.forEach(ev => {
          const theme = getOwnerTheme(ev.owner);
          const timeText = ev.allDay
            ? 'All Day'
            : `${formatTime12or24(ev.startTime)}${ev.endTime ? ' - ' + formatTime12or24(ev.endTime) : ''}`;

          const row = document.createElement('div');
          row.className = 'flex items-center justify-between gap-3 p-3 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/15 cursor-pointer transition';
          row.addEventListener('click', () => populateEventFormForEdit(ev));

          const left = document.createElement('div');
          left.className = 'min-w-0';
          const titleDiv = document.createElement('div');
          titleDiv.className = 'font-extrabold text-base sm:text-lg text-white truncate';
          titleDiv.textContent = ev.title;

          const metaDiv = document.createElement('div');
          metaDiv.className = 'text-xs sm:text-sm font-semibold text-slate-300';
          metaDiv.textContent = `${theme.label} • ${timeText}`;

          left.appendChild(titleDiv);
          left.appendChild(metaDiv);

          const badge = document.createElement('span');
          badge.className = `shrink-0 px-2.5 py-1 rounded-lg text-xs font-bold border ${theme.pillClass}`;
          badge.textContent = 'Edit';

          row.appendChild(left);
          row.appendChild(badge);
          listEl.appendChild(row);
        });
      }

      function resetEventForm(isoDate) {
        document.getElementById('eventFormHeading').textContent = '+ Schedule Event';
        document.getElementById('resetFormBtn').classList.add('hidden');
        document.getElementById('deleteEventBtn').classList.add('hidden');
        document.getElementById('editEventId').value = '';
        document.getElementById('eventTitleInput').value = '';
        document.getElementById('eventDateInput').value = isoDate || selectedDayISO;
        document.getElementById('eventAllDayInput').checked = false;
        document.getElementById('eventTimeRow').classList.remove('hidden');
        document.getElementById('eventStartInput').value = '09:00';
        document.getElementById('eventEndInput').value = '10:00';
        const familyRadio = document.querySelector('input[name="eventOwner"][value="family"]');
        if (familyRadio) familyRadio.checked = true;
      }

      function populateEventFormForEdit(ev) {
        document.getElementById('eventFormHeading').textContent = 'Edit Event';
        document.getElementById('resetFormBtn').classList.remove('hidden');
        document.getElementById('deleteEventBtn').classList.remove('hidden');
        document.getElementById('editEventId').value = ev.id;
        document.getElementById('eventTitleInput').value = ev.title;
        document.getElementById('eventDateInput').value = ev.date;
        document.getElementById('eventAllDayInput').checked = Boolean(ev.allDay);
        document.getElementById('eventTimeRow').classList.toggle('hidden', Boolean(ev.allDay));
        document.getElementById('eventStartInput').value = ev.startTime || '09:00';
        document.getElementById('eventEndInput').value = ev.endTime || '10:00';

        const radio = document.querySelector(`input[name="eventOwner"][value="${ev.owner || 'mine'}"]`);
        if (radio) radio.checked = true;
      }

      function resolveTargetGoogleCalendar(owner) {
        if (owner === 'wife' && settings.mapWifeCalendarId) return settings.mapWifeCalendarId;
        if (owner === 'family' && settings.mapFamilyCalendarId) return settings.mapFamilyCalendarId;
        return settings.mapMineCalendarId || 'primary';
      }

      async function handleSaveEvent(e) {
        e.preventDefault();
        const existingId = document.getElementById('editEventId').value;
        const title = document.getElementById('eventTitleInput').value.trim();
        const ownerRadio = document.querySelector('input[name="eventOwner"]:checked');
        const owner = ownerRadio ? ownerRadio.value : 'mine';
        const date = document.getElementById('eventDateInput').value;
        const allDay = document.getElementById('eventAllDayInput').checked;
        const startTime = document.getElementById('eventStartInput').value;
        const endTime = document.getElementById('eventEndInput').value;

        if (!title || !date) return;

        // Live two-way Google Calendar sync
        if (googleAccessToken) {
          try {
            const targetCalId = resolveTargetGoogleCalendar(owner);
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const bodyPayload = { summary: title };

            if (allDay) {
              const [yy, mm, dd] = date.split('-').map(Number);
              const nextDay = new Date(yy, mm - 1, dd + 1);
              bodyPayload.start = { date };
              bodyPayload.end = { date: toISODate(nextDay) };
            } else {
              bodyPayload.start = { dateTime: `${date}T${startTime}:00`, timeZone: tz };
              bodyPayload.end = { dateTime: `${date}T${endTime || startTime}:00`, timeZone: tz };
            }

            const existing = events.find(item => item.id === existingId);
            if (existing && existing.isGoogle) {
              const calId = existing.googleCalendarId || targetCalId;
              const res = await fetch(
                `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events/${encodeURIComponent(existing.googleEventId)}`,
                {
                  method: 'PATCH',
                  headers: {
                    Authorization: `Bearer ${googleAccessToken}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(bodyPayload)
                }
              );
              if (!res.ok) throw new Error('Update failed');
            } else {
              const res = await fetch(
                `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(targetCalId)}/events`,
                {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${googleAccessToken}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(bodyPayload)
                }
              );
              if (!res.ok) throw new Error('Create failed');
            }

            closeDayModal();
            showToast('Synced to Google Calendar');
            await syncGoogleCalendars();
            return;
          } catch (err) {
            console.error(err);
            showToast('Google save error — check calendar write permissions');
            return;
          }
        }

        // Local storage fallback when not signed into Google
        if (existingId) {
          const idx = events.findIndex(item => item.id === existingId);
          if (idx !== -1) {
            events[idx] = { ...events[idx], title, owner, date, allDay, startTime, endTime };
          }
        } else {
          events.push({
            id: 'local-' + Date.now(),
            title,
            owner,
            date,
            allDay,
            startTime,
            endTime
          });
        }

        saveJSON(STORAGE_EVENTS, events);
        closeDayModal();
        renderActiveView();
        showToast('Event saved');
      }

      async function handleDeleteEvent() {
        const existingId = document.getElementById('editEventId').value;
        if (!existingId) return;

        const target = events.find(item => item.id === existingId);
        if (googleAccessToken && target && target.isGoogle) {
          try {
            await fetch(
              `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(target.googleCalendarId)}/events/${encodeURIComponent(target.googleEventId)}`,
              {
                method: 'DELETE',
                headers: { Authorization: `Bearer ${googleAccessToken}` }
              }
            );
            closeDayModal();
            showToast('Deleted from Google Calendar');
            await syncGoogleCalendars();
            return;
          } catch (err) {
            console.error(err);
            showToast('Could not delete Google event');
            return;
          }
        }

        events = events.filter(item => item.id !== existingId);
        saveJSON(STORAGE_EVENTS, events);
        closeDayModal();
        renderActiveView();
        showToast('Event deleted');
      }

      /* =====================================================================
         8. GOOGLE CALENDAR OAUTH & SYNC (NO TASKS API)
         ===================================================================== */
      function connectGoogleAccount(silentPrompt = false) {
        const inputEl = document.getElementById('clientIdInput');
        const rawClientId = inputEl ? inputEl.value.trim() : settings.googleClientId.trim();

        if (!rawClientId) {
          showToast('Paste your Google OAuth Client ID first');
          return;
        }

        settings.googleClientId = rawClientId;
        saveJSON(STORAGE_SETTINGS, settings);

        if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
          showToast('Google Sign-In is still loading — try again in 2 seconds');
          return;
        }

        tokenClient = window.google.accounts.oauth2.initTokenClient({
          client_id: rawClientId,
          scope: 'https://www.googleapis.com/auth/calendar',
          callback: async (tokenResponse) => {
            if (tokenResponse && tokenResponse.access_token) {
              saveGoogleSession(
                tokenResponse.access_token,
                tokenResponse.expires_in,
                googleCalendars
              );
              updateGoogleConnectionUI(true);
              showToast('Connected to Google Calendar!');
              await loadUserCalendarsList();
              await syncGoogleCalendars();
              startAutoRefresh();
            }
          }
        });

        tokenClient.requestAccessToken({ prompt: silentPrompt ? '' : 'consent' });
      }

      function disconnectGoogleAccount() {
        if (googleAccessToken && window.google && window.google.accounts) {
          window.google.accounts.oauth2.revoke(googleAccessToken, () => {});
        }
        googleAccessToken = null;
        googleTokenExpiresAt = 0;
        googleCalendars = [];
        removeStorageKey(STORAGE_GOOGLE_SESSION);
        clearInterval(autoSyncTimer);
        updateGoogleConnectionUI(false);
        events = loadJSON(STORAGE_EVENTS, getSampleEvents());
        renderActiveView();
        showToast('Disconnected from Google');
      }

      function updateGoogleConnectionUI(isConnected) {
        const badge = document.getElementById('googleStatusBadge');
        const disconnectBtn = document.getElementById('disconnectGoogleBtn');
        const mapSection = document.getElementById('calendarMappingSection');

        if (badge) {
          badge.textContent = isConnected ? 'Connected' : 'Not Connected';
          badge.className = isConnected
            ? 'px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/30 text-emerald-200 border border-emerald-400/40'
            : 'px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-300';
        }
        if (disconnectBtn) disconnectBtn.classList.toggle('hidden', !isConnected);
        if (mapSection) mapSection.classList.toggle('hidden', !isConnected);

        if (isConnected && googleCalendars.length > 0) {
          populateCalendarDropdowns();
        }
      }

      function populateCalendarDropdowns() {
        const dropdownConfigs = [
          { id: 'mapMineSelect', saved: settings.mapMineCalendarId, optional: false },
          { id: 'mapWifeSelect', saved: settings.mapWifeCalendarId, optional: true },
          { id: 'mapFamilySelect', saved: settings.mapFamilyCalendarId, optional: true }
        ];

        dropdownConfigs.forEach(({ id, saved, optional }) => {
          const sel = document.getElementById(id);
          if (!sel) return;
          sel.innerHTML = optional ? '<option value="">-- None --</option>' : '';
          googleCalendars.forEach(cal => {
            const opt = document.createElement('option');
            opt.value = cal.id;
            opt.textContent = cal.summaryOverride || cal.summary;
            if (cal.id === saved || (!saved && cal.primary && !optional)) {
              opt.selected = true;
            }
            sel.appendChild(opt);
          });
        });
      }

      async function loadUserCalendarsList() {
        if (!googleAccessToken) return;
        try {
          const res = await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList', {
            headers: { Authorization: `Bearer ${googleAccessToken}` }
          });
          if (!res.ok) return;
          const data = await res.json();
          googleCalendars = data.items || [];

          const remainingSec = Math.max(60, Math.floor((googleTokenExpiresAt - Date.now()) / 1000));
          saveGoogleSession(googleAccessToken, remainingSec, googleCalendars);
          populateCalendarDropdowns();
        } catch (err) {
          console.error('Failed to load calendarList:', err);
        }
      }

      async function syncGoogleCalendars() {
        if (!googleAccessToken) {
          renderActiveView();
          showToast('Calendar refreshed');
          return;
        }

        const icon = document.getElementById('refreshIcon');
        if (icon) icon.classList.add('animate-spin');

        try {
          const year = viewedMonthDate.getFullYear();
          const month = viewedMonthDate.getMonth();
          const timeMin = new Date(year, month - 1, 1).toISOString();
          const timeMax = new Date(year, month + 2, 0).toISOString();

          const sources = [
            { calId: settings.mapMineCalendarId || 'primary', owner: 'mine' },
            { calId: settings.mapWifeCalendarId, owner: 'wife' },
            { calId: settings.mapFamilyCalendarId, owner: 'family' }
          ].filter(s => Boolean(s.calId));

          const uniqueMap = new Map();
          sources.forEach(s => {
            if (!uniqueMap.has(s.calId)) uniqueMap.set(s.calId, s.owner);
          });

          const fetchedEvents = [];

          for (const [calId, owner] of uniqueMap.entries()) {
            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?singleEvents=true&orderBy=startTime&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&maxResults=250`;
            const res = await fetch(url, {
              headers: { Authorization: `Bearer ${googleAccessToken}` }
            });
            if (res.status === 401) {
              // Token expired while page was open
              removeStorageKey(STORAGE_GOOGLE_SESSION);
              googleAccessToken = null;
              updateGoogleConnectionUI(false);
              showToast('Google session expired — open Settings to reconnect');
              return;
            }
            if (!res.ok) continue;
            const data = await res.json();

            (data.items || []).forEach(item => {
              if (item.status === 'cancelled') return;
              const isAllDay = Boolean(item.start && item.start.date);
              let dateStr = '';
              let startStr = '';
              let endStr = '';

              if (isAllDay) {
                dateStr = item.start.date;
              } else if (item.start && item.start.dateTime) {
                const startObj = new Date(item.start.dateTime);
                dateStr = toISODate(startObj);
                startStr = `${String(startObj.getHours()).padStart(2, '0')}:${String(startObj.getMinutes()).padStart(2, '0')}`;
                if (item.end && item.end.dateTime) {
                  const endObj = new Date(item.end.dateTime);
                  endStr = `${String(endObj.getHours()).padStart(2, '0')}:${String(endObj.getMinutes()).padStart(2, '0')}`;
                }
              }

              if (dateStr) {
                fetchedEvents.push({
                  id: `g-${calId}-${item.id}`,
                  googleEventId: item.id,
                  googleCalendarId: calId,
                  isGoogle: true,
                  title: item.summary || '(Untitled)',
                  owner,
                  date: dateStr,
                  allDay: isAllDay,
                  startTime: startStr,
                  endTime: endStr
                });
              }
            });
          }

          events = fetchedEvents;
          saveJSON(STORAGE_EVENTS, events);
          renderActiveView();
        } catch (err) {
          console.error('Google sync error:', err);
        } finally {
          if (icon) icon.classList.remove('animate-spin');
        }
      }

      function startAutoRefresh() {
        clearInterval(autoSyncTimer);
        autoSyncTimer = setInterval(() => {
          if (googleAccessToken) syncGoogleCalendars();
        }, 120000); // Auto-sync every 2 minutes
      }

      /* =====================================================================
         9. SETTINGS & FULLSCREEN CONTROLS
         ===================================================================== */
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {
            showToast('Use browser menu for Fullscreen');
          });
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      function openSettingsModal() {
        document.getElementById('clientIdInput').value = settings.googleClientId || '';
        document.getElementById('mineNameInput').value = settings.mineName || 'Me';
        document.getElementById('wifeNameInput').value = settings.wifeName || 'Wife';
        document.getElementById('clockFormatSelect').value = settings.clockFormat || '12';
        document.getElementById('wallpaperSelect').value = settings.wallpaperMode || 'rotate';

        if (googleAccessToken && googleCalendars.length > 0) {
          populateCalendarDropdowns();
        }

        const modal = document.getElementById('settingsModal');
        if (modal) {
          modal.classList.remove('hidden');
          modal.classList.add('flex');
        }
      }

      function closeSettingsModal() {
        const modal = document.getElementById('settingsModal');
        if (modal) {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        }
      }

      function saveSettings() {
        settings.googleClientId = document.getElementById('clientIdInput').value.trim();
        settings.mineName = document.getElementById('mineNameInput').value.trim() || 'Me';
        settings.wifeName = document.getElementById('wifeNameInput').value.trim() || 'Wife';
        settings.clockFormat = document.getElementById('clockFormatSelect').value;
        settings.wallpaperMode = document.getElementById('wallpaperSelect').value;

        if (googleAccessToken) {
          const mineSel = document.getElementById('mapMineSelect');
          const wifeSel = document.getElementById('mapWifeSelect');
          const famSel = document.getElementById('mapFamilySelect');
          if (mineSel && mineSel.value) settings.mapMineCalendarId = mineSel.value;
          if (wifeSel) settings.mapWifeCalendarId = wifeSel.value || '';
          if (famSel) settings.mapFamilyCalendarId = famSel.value || '';
        }

        saveJSON(STORAGE_SETTINGS, settings);
        updateClock();
        applyWallpaperPreference();
        closeSettingsModal();

        if (googleAccessToken) {
          syncGoogleCalendars();
        } else {
          renderActiveView();
        }
        showToast('Settings saved');
      }

      /* =====================================================================
         10. INITIALIZATION
         ===================================================================== */
      window.addEventListener('DOMContentLoaded', () => {
        updateClock();
        setInterval(updateClock, 1000);

        applyWallpaperPreference();
        renderActiveView();

        // Restore saved Google OAuth token & calendar list across refreshes
        const hasValidSession = restoreGoogleSession();
        if (hasValidSession) {
          updateGoogleConnectionUI(true);
          syncGoogleCalendars();
          startAutoRefresh();
        } else {
          updateGoogleConnectionUI(false);
        }

        // View Toggle Buttons
        document.getElementById('viewMonthBtn').addEventListener('click', () => setCalendarView('month'));
        document.getElementById('viewWeekBtn').addEventListener('click', () => setCalendarView('week'));
        document.getElementById('viewScheduleBtn').addEventListener('click', () => setCalendarView('schedule'));
        document.getElementById('scheduleAddBtn').addEventListener('click', () => openDayModal(toISODate(new Date())));

        // Top Bar Controls (steps by week in Week view, or by month in Month/Schedule views)
        document.getElementById('prevMonthBtn').addEventListener('click', () => {
          if (currentView === 'week') {
            viewedWeekAnchorDate = new Date(
              viewedWeekAnchorDate.getFullYear(),
              viewedWeekAnchorDate.getMonth(),
              viewedWeekAnchorDate.getDate() - 7
            );
          } else {
            viewedMonthDate = new Date(viewedMonthDate.getFullYear(), viewedMonthDate.getMonth() - 1, 1);
            viewedWeekAnchorDate = new Date(viewedMonthDate.getFullYear(), viewedMonthDate.getMonth(), 1);
          }
          if (googleAccessToken) syncGoogleCalendars();
          else renderActiveView();
        });

        document.getElementById('nextMonthBtn').addEventListener('click', () => {
          if (currentView === 'week') {
            viewedWeekAnchorDate = new Date(
              viewedWeekAnchorDate.getFullYear(),
              viewedWeekAnchorDate.getMonth(),
              viewedWeekAnchorDate.getDate() + 7
            );
          } else {
            viewedMonthDate = new Date(viewedMonthDate.getFullYear(), viewedMonthDate.getMonth() + 1, 1);
            viewedWeekAnchorDate = new Date(viewedMonthDate.getFullYear(), viewedMonthDate.getMonth(), 1);
          }
          if (googleAccessToken) syncGoogleCalendars();
          else renderActiveView();
        });

        document.getElementById('todayBtn').addEventListener('click', () => {
          const now = new Date();
          viewedMonthDate = new Date(now.getFullYear(), now.getMonth(), 1);
          viewedWeekAnchorDate = now;
          if (googleAccessToken) syncGoogleCalendars();
          else renderActiveView();
        });

        document.getElementById('nextMonthBtn').addEventListener('click', () => {
          viewedMonthDate = new Date(viewedMonthDate.getFullYear(), viewedMonthDate.getMonth() + 1, 1);
          if (googleAccessToken) syncGoogleCalendars();
          else renderActiveView();
        });

        document.getElementById('todayBtn').addEventListener('click', () => {
          viewedMonthDate = new Date();
          if (googleAccessToken) syncGoogleCalendars();
          else renderActiveView();
        });

        document.getElementById('refreshBtn').addEventListener('click', () => syncGoogleCalendars());
        document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
        document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);

        // Day / Event Modal Controls
        document.getElementById('closeDayModalBtn').addEventListener('click', closeDayModal);
        document.getElementById('resetFormBtn').addEventListener('click', () => resetEventForm(selectedDayISO));
        document.getElementById('eventAllDayInput').addEventListener('change', (e) => {
          document.getElementById('eventTimeRow').classList.toggle('hidden', e.target.checked);
        });
        document.getElementById('eventForm').addEventListener('submit', handleSaveEvent);
        document.getElementById('deleteEventBtn').addEventListener('click', handleDeleteEvent);

        // Settings Modal Controls
        document.getElementById('closeSettingsBtn').addEventListener('click', closeSettingsModal);
        document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
        document.getElementById('connectGoogleBtn').addEventListener('click', () => connectGoogleAccount(false));
        document.getElementById('disconnectGoogleBtn').addEventListener('click', disconnectGoogleAccount);
      });
    })();
  </script>
